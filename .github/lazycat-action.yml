version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/lunatv-enhanced.lpk

update:
  strategy: publish
  version_source:
    type: image
    image: lunatv

build:
  run_buildscript: false

images:
  - id: lunatv
    target: service
    service: lunatv-enhanced
    source: ghcr.io/szemeng76/lunatv
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    version_regex: '^v?(?P<version>\d+\.\d+\.\d+)$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: LunaTV Enhanced
    summary: Published from GitHub Actions
