name: LunaTV Enhanced
package: community.lazycat.app.lunatv-enhanced
version: 6.0.0
min_os_version: 1.3.8
description: 🎬 LunaTV Enhanced Edition 是基于 MoonTV 深度二次开发的全功能影视聚合播放平台。在原版基础上新增了 YouTube 集成、网盘搜索、AI 推荐、短剧功能、IPTV 直播、Bangumi 动漫、播放统计、弹幕系统等 50+ 重大功能增强，打造极致的在线观影体验。
homepage: https://github.com/SzeMeng76/LunaTV
author: SzeMeng76
application:
  subdomain: lunatv-enhanced
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://lunatv-enhanced:3000/

services:
  lunatv-enhanced:
    container_name: lunatv-enhanced
    #   ghcr.io/szemeng76/lunatv:6.0.0
    image: registry.lazycat.cloud/czyt/szemeng76/lunatv:eef22c2dd4e5c1c6
    environment:
      - USERNAME={{ .U.admin_username }}
      - PASSWORD={{ .U.admin_password }}
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      - KVROCKS_URL=redis://lunatv-kvrocks:6666
    depends_on:
      - lunatv-kvrocks

  lunatv-kvrocks:
    # apache/kvrocks
    image: registry.lazycat.cloud/czyt/apache/kvrocks:2821d3ee858b63a9
    container_name: lunatv-kvrocks
    restart: unless-stopped
    user: root
    binds:
      - /lzcapp/var/data:/var/lib/kvrocks/data
    entrypoint: kvrocks -c /var/lib/kvrocks/kvrocks.conf --dir /var/lib/kvrocks/data --pidfile /var/run/kvrocks/kvrocks.pid --bind 0.0.0.0

locales:
  zh:
    name: "LunaTV Enhanced"
    description: "🎬 LunaTV Enhanced Edition 是基于 MoonTV 深度二次开发的全功能影视聚合播放平台。在原版基础上新增了 YouTube 集成、网盘搜索、AI 推荐、短剧功能、IPTV 直播、Bangumi 动漫、播放统计、弹幕系统等 50+ 重大功能增强，打造极致的在线观影体验。"
  en:
    name: "LunaTV Enhanced"
    description: "🎬 LunaTV Enhanced Edition is a fully-featured movie and TV 聚合 playback platform based on deep secondary development of MoonTV. It adds over 50 major functional enhancements including YouTube integration, cloud disk search, AI recommendations, short drama features, IPTV live streaming, Bangumi anime, playback statistics, and a danmaku system, creating an ultimate online movie-watching experience."
